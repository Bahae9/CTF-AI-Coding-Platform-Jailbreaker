# Learnify — intentionally vulnerable CTF target.
# Run from the repo root:  docker compose up --build
# Then open http://localhost:13000
#
# Published address is configurable (defaults = localhost:13000):
#   LEARNIFY_PORT=8080 docker compose up           # use a different port
#   LEARNIFY_BIND=0.0.0.0 docker compose up         # expose to your LAN (host for others)

services:
  backend:
    build: ./challenge
    container_name: learnify_backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./challenge
    container_name: learnify_frontend
    command: >
      streamlit run frontend/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    environment:
      - API_BASE_URL=http://nginx-system/api
    expose:
      - "8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx-system:
    image: nginx:1.27-alpine
    container_name: learnify_gateway
    ports:
      - "${LEARNIFY_BIND:-127.0.0.1}:${LEARNIFY_PORT:-13000}:80"
    volumes:
      - ./challenge/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
